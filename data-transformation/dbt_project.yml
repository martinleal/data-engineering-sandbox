name: 'data_engineering_sandbox'
version: '1.0.0'
config-version: 2

profile: 'sandbox'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_engineering_sandbox:
    01_stg:
      +materialized: view
      +database: DEV_STG
      tpch_sf1:
        +schema: TPCH_SF1_DATA_ENGINEER_1

    02_rdv:
      +materialized: incremental
      +database: DEV_RDV
      tpch_sf1:
        +schema: TPCH_SF1_DATA_ENGINEER_1

    03_bdv:
      +materialized: view
      +database: DEV_BDV
      sales:
        +schema: SALES_DATA_ENGINEER_1

    04_gold:
      +materialized: incremental
      +database: DEV_GOLD
      sales:
        +schema: SALES_DATA_ENGINEER_1