name: 'data_engineering_sandbox'
version: '1.0.0'
config-version: 2

profile: 'sandbox'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_engineering_sandbox:
    01_stg:
      +materialized: view
      +database: "{{ target.database }}_STG"
      tpch_sf1:
        +schema: TPCH_SF1

    02_rdv:
      +materialized: incremental
      +database: "{{ target.database }}_RDV"
      tpch_sf1:
        +schema: TPCH_SF1

    03_bdv:
      +materialized: view
      +database: "{{ target.database }}_BDV"
      sales:
        +schema: SALES

    04_gold:
      +materialized: incremental
      +database: "{{ target.database }}_GOLD"
      sales:
        +schema: SALES