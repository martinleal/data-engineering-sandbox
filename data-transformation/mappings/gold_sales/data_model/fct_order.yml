# ==============================================================================
# GOLD LAYER: SALES STAR SCHEMA
# Description: Item-level fact table for finalized orders with logistics and finance
# ==============================================================================

target_model: "FACT_ORDER"

config:
  materialization: "incremental"
  unique_key: "FACT_ORDER_SK"

semantics:
  description: "Current-state fact table at the order line grain, containing financial measures, logistics performance, and comprehensive dimensional keys for slice-and-dice analytics."
  grain: "One row per Order Line."

# ------------------------------------------------------------------------------
# DATA VAULT SOURCES & JOIN PATH
# ------------------------------------------------------------------------------
join_logic:
  # The Bridge serves as the factless spine, guaranteeing no fan-outs
  base_table: "BRG_ORDER_LINE"
  base_alias: "brg"
  joins:
    - table: "BSAT_ORDER"
      alias: "ord"
      type: "inner"
      on: "brg.HK_ORDER = ord.HK_ORDER"
      condition: "ord.IS_CURRENT = TRUE" 
      
    - table: "BSAT_ORDER_LINE_FINANCE"
      alias: "fin"
      type: "inner"
      on: "brg.HK_ORDER_LINE = fin.HK_ORDER_LINE"
      condition: "fin.IS_CURRENT = TRUE"
      
    - table: "BSAT_ORDER_LINE_LOGISTICS"
      alias: "log"
      type: "inner"
      on: "brg.HK_ORDER_LINE = log.HK_ORDER_LINE"
      condition: "log.IS_CURRENT = TRUE"

# ------------------------------------------------------------------------------
# FACT PAYLOAD
# ------------------------------------------------------------------------------
columns:
  # --- PRIMARY KEY ---
  - target_column: "FACT_ORDER_SK"
    source_expression: "brg.HK_ORDER_LINE"
    type: "primary_key"
    quality:
      - test: "unique"
      - test: "not_null"

  # --- CORE DIMENSION KEYS ---
  - target_column: "DIM_CUSTOMER_SK"
    source_expression: "brg.HK_CUSTOMER"
    type: "dimension_key"
    quality:
      - test: "not_null"

  - target_column: "DIM_PRODUCT_SK"
    source_expression: "brg.HK_PRODUCT"
    type: "dimension_key"
    quality:
      - test: "not_null"

  - target_column: "DIM_SUPPLIER_SK"
    source_expression: "brg.HK_SUPPLIER"
    type: "dimension_key"
    quality:
      - test: "not_null"

  - target_column: "ORDER_DATE_SK"
    source_expression: "CAST(TO_CHAR(ord.ORDER_DT, 'YYYYMMDD') AS INTEGER)"
    type: "dimension_key"
    quality:
      - test: "not_null"
      
  - target_column: "SHIP_DATE_SK"
    source_expression: "CAST(TO_CHAR(log.SHIP_DT, 'YYYYMMDD') AS INTEGER)"
    type: "dimension_key"

  # --- ROLE-PLAYING DIMENSION KEYS (Nation & Region) ---
  - target_column: "DIM_CUSTOMER_NATION_SK"
    source_expression: "brg.HK_CUSTOMER_NATION"
    type: "dimension_key"
    semantics:
      description: "Surrogate key joining to DIM_NATION representing the Customer's country."

  - target_column: "DIM_SUPPLIER_NATION_SK"
    source_expression: "brg.HK_SUPPLIER_NATION"
    type: "dimension_key"
    semantics:
      description: "Surrogate key joining to DIM_NATION representing the Supplier's country."

  - target_column: "DIM_CUSTOMER_REGION_SK"
    source_expression: "brg.HK_CUSTOMER_REGION"
    type: "dimension_key"

  - target_column: "DIM_SUPPLIER_REGION_SK"
    source_expression: "brg.HK_SUPPLIER_REGION"
    type: "dimension_key"

  # --- DEGENERATE DIMENSIONS ---
  - target_column: "ORDER_STATUS_CD"
    source_expression: "ord.ORDER_STATUS_CD"
    type: "degenerate_dimension"

  - target_column: "IS_LATE_SHIPMENT_FL"
    source_expression: "log.IS_LATE_SHIPMENT_FL"
    type: "degenerate_dimension"
    semantics:
      description: "Pre-calculated flag indicating if the specific line item shipped after the committed date."

  # --- MEASURES ---
  - target_column: "QUANTITY_NUM"
    source_expression: "fin.QUANTITY_VL"
    type: "measure"

  - target_column: "GROSS_AMOUNT_VL"
    source_expression: "fin.GROSS_AMOUNT_VL"
    type: "measure"

  - target_column: "DISCOUNT_PCT"
    source_expression: "fin.DISCOUNT_PCT"
    type: "measure"

  - target_column: "NET_REVENUE_AMT"
    source_expression: "fin.NET_REVENUE_AMT"
    type: "measure"