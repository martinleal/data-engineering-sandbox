target_model: "BSAT_REGION"

# ------------------------------------------------------------------------------
# METADATA & CONFIGURATION
# ------------------------------------------------------------------------------
config:
  materialization: "incremental"

semantics:
  description: "Business Data Vault satellite containing cleansed geographic region reference data."

# ------------------------------------------------------------------------------
# DATA VAULT KEYS
# ------------------------------------------------------------------------------
parent_hub: "HUB_REGION"
hash_key: "HK_REGION"
diff_hash: "HD_BDV_REGION"

# ------------------------------------------------------------------------------
# PAYLOAD: TRANSFORMATIONS & QUALITY
# ------------------------------------------------------------------------------
source_models:
  - "SAT_REGION"

payload:
  - target_column: "REGION_NAME"
    source_expression: "UPPER(TRIM(NAME))"
    semantics:
      description: "The full, standardized, and capitalized name of the region."
    quality:
      - test: "not_null"