target_model: "BSAT_ORDER_LINE_FINANCE"

# ------------------------------------------------------------------------------
# METADATA & CONFIGURATION
# ------------------------------------------------------------------------------
config:
  materialization: "incremental"

semantics:
  description: "Business Data Vault satellite containing cleansed and calculated financial metrics for order lines."

# ------------------------------------------------------------------------------
# DATA VAULT KEYS
# ------------------------------------------------------------------------------
parent_hub: "HUB_ORDER_LINE"
hash_key: "HK_ORDER_LINE"
diff_hash: "HD_BDV_ORDER_LINE_FINANCE"

# ------------------------------------------------------------------------------
# PAYLOAD: TRANSFORMATIONS & QUALITY
# ------------------------------------------------------------------------------
source_models:
  - "SAT_ORDER_LINE_FINANCE"

payload:
  - target_column: "QUANTITY_VL"
    source_expression: "CAST(QUANTITY AS NUMBER(38,2))"
    semantics:
      description: "The total number of units purchased in this order line."
    quality:
      - test: "not_null"
      - test: "dbt_expectations.expect_column_values_to_be_between"
        min_value: 1

  - target_column: "GROSS_AMOUNT_VL"
    source_expression: "EXTENDEDPRICE"
    semantics:
      description: "Gross revenue amount before any discounts or taxes."
    quality:
      - test: "not_null"

  - target_column: "DISCOUNT_PCT"
    source_expression: "COALESCE(DISCOUNT, 0.00)"
    semantics:
      description: "Discount percentage applied. Nulls are converted to zero."

  - target_column: "TAX_PCT"
    source_expression: "COALESCE(TAX, 0.00)"
    semantics:
      description: "Tax percentage applied. Nulls are converted to zero."

  - target_column: "NET_REVENUE_AMT"
    source_expression: "EXTENDEDPRICE * (1 - COALESCE(DISCOUNT, 0.00))"
    semantics:
      description: "Calculated net revenue (Gross Amount minus Discount)."
    quality:
      - test: "not_null"