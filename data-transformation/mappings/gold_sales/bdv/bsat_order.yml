target_model: "BSAT_ORDER"

# ------------------------------------------------------------------------------
# METADATA & CONFIGURATION
# ------------------------------------------------------------------------------
config:
  materialization: "incremental"

semantics:
  description: "Business Data Vault satellite containing cleansed attributes, statuses, and monetary values for finalized orders."

# ------------------------------------------------------------------------------
# DATA VAULT KEYS
# ------------------------------------------------------------------------------
parent_hub: "HUB_ORDER"
hash_key: "HK_ORDER"
diff_hash: "HD_BDV_ORDER"

# ------------------------------------------------------------------------------
# PAYLOAD: TRANSFORMATIONS & QUALITY
# ------------------------------------------------------------------------------
source_models:
  - "SAT_ORDER"

payload:
  - target_column: "ORDER_STATUS_CD"
    source_expression: "UPPER(TRIM(ORDERSTATUS))"
    semantics:
      description: "Standardized single-character order status code (e.g., O = Open, F = Filled, P = Pending)."
    quality:
      - test: "not_null"
      - test: "accepted_values"
        values: ['O', 'F', 'P']

  - target_column: "TOTAL_PRICE_VL"
    source_expression: "CAST(TOTALPRICE AS NUMBER(38,2))"
    semantics:
      description: "Total calculated price of the order in the base currency."
    quality:
      - test: "not_null"

  - target_column: "ORDER_DT"
    source_expression: "CAST(ORDERDATE AS DATE)"
    semantics:
      description: "The calendar date when the customer placed the order."
    quality:
      - test: "not_null"

  - target_column: "ORDER_PRIORITY_CD"
    source_expression: "UPPER(TRIM(ORDERPRIORITY))"
    semantics:
      description: "Priority level assigned to the order fulfillment (e.g., '1-URGENT', '2-HIGH')."
    quality:
      - test: "not_null"

  - target_column: "CLERK_TX"
    source_expression: "TRIM(CLERK)"
    semantics:
      description: "String identifier of the clerk who processed the order."

  - target_column: "SHIP_PRIORITY_CD"
    source_expression: "CAST(SHIPPRIORITY AS INTEGER)"
    semantics:
      description: "Numeric priority code used by the logistics department for shipping."

  - target_column: "ORDER_COMMENT_TX"
    source_expression: "TRIM(COMMENT)"
    semantics:
      description: "Free-text comments or special instructions associated with the order."