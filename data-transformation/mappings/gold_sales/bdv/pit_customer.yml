target_model: "PIT_CUSTOMER"
parent_hub: "HUB_CUSTOMER"

config:
  materialization: "incremental"

semantics:
  description: "Daily snapshot table aligning timestamps for Customer Account and Contact satellites to enable seamless generation of an SCD-2 Customer Dimension."

snapshot_logic:
  frequency: "DAILY"
  snapshot_column: "SNAPSHOT_DATE"
  ghost_record_config:
    enabled: true
    ghost_timestamp: "'1900-01-01 00:00:00'" 
    
quality:
  model_tests:
    - test: "dbt_utils.unique_combination_of_columns"
      combination_of_columns:
        - "HK_CUSTOMER"
        - "SNAPSHOT_DATE"

satellites:
  - table: "SAT_CUSTOMER_ACCOUNT"
    hk_column: "HK_CUSTOMER"
    ts_column: "_LOAD_TIMESTAMP"
    alias: "SAT_ACCOUNT"
    
  - table: "SAT_CUSTOMER_CONTACT"
    hk_column: "HK_CUSTOMER"
    ts_column: "_LOAD_TIMESTAMP"
    alias: "SAT_CONTACT"