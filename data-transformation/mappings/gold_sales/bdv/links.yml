# ==============================================================================
# BUSINESS DATA VAULT: SALES DOMAIN LINKS
# Description: Exposes the relevant enterprise RDV Links to the Sales domain
# ==============================================================================
config:
  materialization: "view" 

links:
  # ----------------------------------------------------------------------------
  # LINK: ORDER TO CUSTOMER
  # ----------------------------------------------------------------------------
  - target_model: "LNK_ORDER_CUSTOMER"
    source_model: "RDV_S3_DATA.LNK_ORDER_CUSTOMER"
    hash_key: "HK_LNK_ORDER_CUSTOMER"
    foreign_hash_keys:
      - "HK_ORDER"
      - "HK_CUSTOMER"
    semantics:
      description: "Captures the relationship between a finalized order and the purchasing customer."
    quality:
      - column: "HK_LNK_ORDER_CUSTOMER"
        tests:
          - "not_null"
          - "unique"
      - column: "HK_ORDER"
        tests:
          - "not_null"
      - column: "HK_CUSTOMER"
        tests:
          - "not_null"

  # ----------------------------------------------------------------------------
  # LINK: ORDER LINE
  # ----------------------------------------------------------------------------
  - target_model: "LNK_ORDER_LINE"
    source_model: "RDV_S3_DATA.LNK_ORDER_LINE"
    hash_key: "HK_LNK_ORDER_LINE"
    foreign_hash_keys:
      - "HK_ORDER_LINE"
      - "HK_ORDER"
    semantics:
      description: "The core fulfillment relationship connecting a line item to its parent order."
    quality:
      - column: "HK_LNK_ORDER_LINE_PRODUCT_SUPPLIER"
        tests:
          - "not_null"
          - "unique"
      - column: "HK_ORDER_LINE"
        tests:
          - "not_null"
      - column: "HK_ORDER"
        tests:
          - "not_null"

  # ----------------------------------------------------------------------------
  # LINK: ORDER LINE PRODUCT SUPPLIER
  # ----------------------------------------------------------------------------
  - target_model: "LNK_ORDER_LINE_PRODUCT_SUPPLIER"
    source_model: "RDV_S3_DATA.LNK_ORDER_LINE_PRODUCT_SUPPLIER"
    hash_key: "HK_LNK_ORDER_LINE_PRODUCT_SUPPLIER"
    foreign_hash_keys:
      - "HK_ORDER_LINE"
      - "HK_ORDER"
      - "HK_PRODUCT"
      - "HK_SUPPLIER"
    semantics:
      description: "Captures the relationship between the order line, the product sold, and the supplier providing it."
    quality:
      - column: "HK_LNK_ORDER_LINE_PRODUCT_SUPPLIER"
        tests:
          - "not_null"
          - "unique"
      - column: "HK_ORDER_LINE"
        tests:
          - "not_null"
      - column: "HK_ORDER"
        tests:
          - "not_null"
      - column: "HK_PRODUCT"
        tests:
          - "not_null"
      - column: "HK_SUPPLIER"
        tests:
          - "not_null"

# ----------------------------------------------------------------------------
  # LINK: PRODUCT SUPPLIER
  # ----------------------------------------------------------------------------
  - target_model: "LNK_PRODUCT_SUPPLIER"
    source_model: "RDV_S3_DATA.LNK_PRODUCT_SUPPLIER"
    hash_key: "HK_LNK_PRODUCT_SUPPLIER"
    foreign_hash_keys:
      - "HK_PRODUCT"
      - "HK_SUPPLIER"
    semantics:
      description: "Relationship defining which suppliers are capable of providing which products (sourced from parts/supplier catalog)."
    quality:
      - column: "HK_LNK_PRODUCT_SUPPLIER"
        tests:
          - "not_null"
          - "unique"
      - column: "HK_PRODUCT"
        tests:
          - "not_null"
      - column: "HK_SUPPLIER"
        tests:
          - "not_null"