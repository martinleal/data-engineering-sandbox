target_model: "BSAT_SUPPLIER_ACCOUNT"

# ------------------------------------------------------------------------------
# METADATA & CONFIGURATION
# ------------------------------------------------------------------------------
config:
  materialization: "incremental"

semantics:
  description: "Business Data Vault satellite containing cleansed attributes, contact information, and financial standings for suppliers."

# ------------------------------------------------------------------------------
# DATA VAULT KEYS
# ------------------------------------------------------------------------------
parent_hub: "HUB_SUPPLIER"
hash_key: "HK_SUPPLIER"
diff_hash: "HD_BDV_SUPPLIER"

# ------------------------------------------------------------------------------
# PAYLOAD: TRANSFORMATIONS & QUALITY
# ------------------------------------------------------------------------------
source_models:
  - "SAT_SUPPLIER_ACCOUNT"

payload:
  - target_column: "ACCOUNT_BALANCE_VL"
    source_expression: "CAST(ACCTBAL AS NUMBER(38,2))"
    semantics:
      description: "The current financial account balance for the supplier in the base currency."
    quality:
      - test: "not_null"

  - target_column: "ACCOUNT_STATUS_CD"
    source_expression: "CASE WHEN ACCTBAL < 0 THEN 'OVERDRAWN' WHEN ACCTBAL = 0 THEN 'ZERO' ELSE 'GOOD_STANDING' END"
    semantics:
      description: "Business rule categorization of the supplier's financial standing based on their account balance."
    quality:
      - test: "not_null"
      - test: "accepted_values"
        values: ['OVERDRAWN', 'ZERO', 'GOOD_STANDING']