# ==============================================================================
# BUSINESS DATA VAULT: SALES DOMAIN HUBS
# Description: Exposes the relevant enterprise RDV Hubs to the Sales domain
# ==============================================================================

config:
  materialization: "view" 
  schema: "BDV_SALES"

hubs:
  # ----------------------------------------------------------------------------
  # HUB: ORDER
  # ----------------------------------------------------------------------------
  - target_model: "BHUB_ORDER"
    source_model: "RDV_S3_DATA.HUB_ORDER"
    hash_key: "HK_ORDER"
    business_keys: 
      - "ID_ORDER"
    semantics:
      description: "Enterprise Hub representing a finalized customer transaction header."
    quality:
      - column: "ID_ORDER"
        tests:
          - "not_null"
          - "unique"

  # ----------------------------------------------------------------------------
  # HUB: ORDER LINE
  # ----------------------------------------------------------------------------
  - target_model: "BHUB_ORDER_LINE"
    source_model: "RDV_S3_DATA.HUB_ORDER_LINE"
    hash_key: "HK_ORDER_LINE"
    business_keys: 
      - "ID_ORDER"
      - "ID_ORDER_LINE"
    semantics:
      description: "Enterprise Hub representing individual items within an order."
    quality:
      - column: "HK_ORDER_LINE"
        tests:
          - "unique"
      - column: "ID_ORDER"
        tests:
          - "not_null"
      - column: "ID_ORDER_LINE"
        tests:
          - "not_null"

  # ----------------------------------------------------------------------------
  # HUB: CUSTOMER
  # ----------------------------------------------------------------------------
  - target_model: "BHUB_CUSTOMER"
    source_model: "RDV_S3_DATA.HUB_CUSTOMER"
    hash_key: "HK_CUSTOMER"
    business_keys: 
      - "ID_CUSTOMER"
    semantics:
      description: "Enterprise Hub representing the purchasing entity (client)."
    quality:
      - column: "ID_CUSTOMER"
        tests:
          - "not_null"
          - "unique"

  # ----------------------------------------------------------------------------
  # HUB: PRODUCT
  # ----------------------------------------------------------------------------
  - target_model: "BHUB_PRODUCT"
    source_model: "RDV_S3_DATA.HUB_PRODUCT"
    hash_key: "HK_PRODUCT"
    business_keys: 
      - "ID_PRODUCT"
    semantics:
      description: "Enterprise Hub representing the physical item being sold."
    quality:
      - column: "ID_PRODUCT"
        tests:
          - "not_null"
          - "unique"

  # ----------------------------------------------------------------------------
  # HUB: NATION
  # ----------------------------------------------------------------------------
  - target_model: "BHUB_NATION"
    source_model: "RDV_S3_DATA.HUB_NATION"
    hash_key: "HK_NATION"
    business_keys: 
      - "ID_NATION"
    semantics:
      description: "Enterprise Hub representing a country or nation."
    quality:
      - column: "ID_NATION"
        tests:
          - "not_null"
          - "unique"

  # ----------------------------------------------------------------------------
  # HUB: REGION
  # ----------------------------------------------------------------------------
  - target_model: "BHUB_REGION"
    source_model: "RDV_S3_DATA.HUB_REGION"
    hash_key: "HK_REGION"
    business_keys: 
      - "ID_REGION"
    semantics:
      description: "Enterprise Hub representing a broad geographical region."
    quality:
      - column: "ID_REGION"
        tests:
          - "not_null"
          - "unique"

  # ----------------------------------------------------------------------------
  # HUB: SUPPLIER
  # ----------------------------------------------------------------------------
  - target_model: "BHUB_SUPPLIER"
    source_model: "RDV_S3_DATA.HUB_SUPPLIER"
    hash_key: "HK_SUPPLIER"
    business_keys: 
      - "ID_SUPPLIER"
    semantics:
      description: "Enterprise Hub representing the entity that supplies products."
    quality:
      - column: "ID_SUPPLIER"
        tests:
          - "not_null"
          - "unique"