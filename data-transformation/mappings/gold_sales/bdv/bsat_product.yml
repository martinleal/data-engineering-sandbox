target_model: "BSAT_PRODUCT"

# ------------------------------------------------------------------------------
# METADATA & CONFIGURATION
# ------------------------------------------------------------------------------
config:
  materialization: "incremental"

semantics:
  description: "Business Data Vault satellite containing cleansed attributes, categorizations, and pricing details for products."

# ------------------------------------------------------------------------------
# DATA VAULT KEYS
# ------------------------------------------------------------------------------
parent_hub: "HUB_PRODUCT"
hash_key: "HK_PRODUCT"
diff_hash: "HD_BDV_PRODUCT"

# ------------------------------------------------------------------------------
# PAYLOAD: TRANSFORMATIONS & QUALITY
# ------------------------------------------------------------------------------
source_models:
  - "SAT_PRODUCT"

payload:
  - target_column: "PRODUCT_NAME"
    source_expression: "TRIM(NAME)"
    semantics:
      description: "The full, standardized name of the product."
    quality:
      - test: "not_null"

  - target_column: "MANUFACTURER_NAME"
    source_expression: "TRIM(MFGR)"
    semantics:
      description: "The name of the manufacturer that produces the item."
    quality:
      - test: "not_null"

  - target_column: "BRAND_NAME"
    source_expression: "TRIM(BRAND)"
    semantics:
      description: "The brand categorization of the product."
    quality:
      - test: "not_null"

  - target_column: "PRODUCT_TYPE_NAME"
    source_expression: "TRIM(TYPE)"
    semantics:
      description: "The physical makeup or material categorization of the product (e.g., LARGE BRUSHED BRASS)."

  - target_column: "PRODUCT_SIZE_NUM"
    source_expression: "CAST(SIZE AS INTEGER)"
    semantics:
      description: "The numeric physical size of the product."
    quality:
      - test: "not_null"
      - test: "dbt_expectations.expect_column_values_to_be_between"
        min_value: 1
        max_value: 50

  - target_column: "CONTAINER_TYPE_CD"
    source_expression: "UPPER(TRIM(CONTAINER))"
    semantics:
      description: "The type of packaging used for the product (e.g., JUMBO BOX, WRAP BAG)."

  - target_column: "RETAIL_PRICE_VL"
    source_expression: "CAST(RETAILPRICE AS NUMBER(38,2))"
    semantics:
      description: "The standard manufacturer's suggested retail price (MSRP) for the product."
    quality:
      - test: "not_null"

  - target_column: "IS_PREMIUM_PRODUCT"
    source_expression: "CAST(CASE WHEN RETAILPRICE > 1500 THEN 1 ELSE 0 END AS BOOLEAN)"
    semantics:
      description: "Business rule flag identifying premium products based on a retail price threshold."
    quality:
      - test: "not_null"