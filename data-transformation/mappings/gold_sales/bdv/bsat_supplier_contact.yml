target_model: "BSAT_SUPPLIER_CONTACT"

# ------------------------------------------------------------------------------
# METADATA & CONFIGURATION
# ------------------------------------------------------------------------------
config:
  materialization: "incremental"

semantics:
  description: "Business Data Vault satellite containing cleansed attributes, contact information, and financial standings for suppliers."

# ------------------------------------------------------------------------------
# DATA VAULT KEYS
# ------------------------------------------------------------------------------
parent_hub: "HUB_SUPPLIER"
hash_key: "HK_SUPPLIER"
diff_hash: "HD_BDV_SUPPLIER"

# ------------------------------------------------------------------------------
# PAYLOAD: TRANSFORMATIONS & QUALITY
# ------------------------------------------------------------------------------
source_models:
  - "SAT_SUPPLIER_CONTACT"

payload:
  - target_column: "SUPPLIER_NAME"
    source_expression: "TRIM(NAME)"
    semantics:
      description: "The full, standardized name of the supplier."
    security:
      pii: true
      category: "DIRECT_IDENTIFIER"
      masking_policy: "MASK_FULL_STRING"
    quality:
      - test: "not_null"

  - target_column: "ADDRESS_TX"
    source_expression: "TRIM(ADDRESS)"
    semantics:
      description: "The physical street address of the supplier."
    security:
      pii: true
      category: "LOCATION"
      masking_policy: "MASK_FULL_STRING"
    quality:
      - test: "not_null"

  - target_column: "PHONE_NUMBER_TX"
    source_expression: "TRIM(PHONE)"
    semantics:
      description: "The primary contact phone number for the supplier."
    security:
      pii: true
      category: "DIRECT_IDENTIFIER"
      masking_policy: "MASK_FULL_STRING"
