# ==============================================================================
# RAW DATA VAULT METADATA: ORDER (Source: ORDERS)
# ==============================================================================

source_model: "PRO_RAW.TPCH_SF1.ORDERS"

# ------------------------------------------------------------------------------
# 1. HUBS (Core Business Entities)
# ------------------------------------------------------------------------------
hubs:
  - target_model: "HUB_ORDER"
    hash_key: "HK_ORDER"
    business_keys: 
      ID_ORDER: "O_ORDERKEY"

  - target_model: "HUB_CUSTOMER"
    hash_key: "HK_CUSTOMER"
    business_keys: 
      ID_CUSTOMER: "O_CUSTKEY"

# ------------------------------------------------------------------------------
# 2. LINKS (Relationships between Hubs)
# ------------------------------------------------------------------------------
links:
  - target_model: "LNK_ORDER_CUSTOMER"
    hash_key: "HK_LNK_ORDER_CUSTOMER"
    foreign_hash_keys:
      - "HK_ORDER"
      - "HK_CUSTOMER"

# ------------------------------------------------------------------------------
# 3. SATELLITES (Descriptive Context)
# ------------------------------------------------------------------------------
satellites:
  - target_model: "SAT_ORDER"
    parent_hash_key: "HK_ORDER"
    diff_hash: "HD_ORDER"
    payload:
      ORDERSTATUS: "O_ORDERSTATUS"
      TOTALPRICE: "O_TOTALPRICE"
      ORDERDATE: "O_ORDERDATE"
      ORDERPRIORITY: "O_ORDERPRIORITY"
      CLERK: "O_CLERK"
      SHIPPRIORITY: "O_SHIPPRIORITY"
      COMMENT: "O_COMMENT"

# ------------------------------------------------------------------------------
# 4. METADATA MAPPING 
# ------------------------------------------------------------------------------
metadata:
  load_timestamp: "_LOAD_TIMESTAMP"
  record_source: "_RECORD_SOURCE"