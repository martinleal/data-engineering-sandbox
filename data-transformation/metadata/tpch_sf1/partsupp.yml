# ==============================================================================
# RAW DATA VAULT METADATA: PRODUCT SUPPLIER (Source: PARTSUPP)
# ==============================================================================

source_model: "PRO_RAW.TPCH_SF1.PARTSUPP"

# ------------------------------------------------------------------------------
# 1. HUBS (Core Business Entities)
# ------------------------------------------------------------------------------
hubs:
  - target_model: "HUB_PRODUCT"
    hash_key: "HK_PRODUCT"
    business_keys: 
      ID_PRODUCT: "PS_PARTKEY"

  - target_model: "HUB_SUPPLIER"
    hash_key: "HK_SUPPLIER"
    business_keys: 
      ID_SUPPLIER: "PS_SUPPKEY"

# ------------------------------------------------------------------------------
# 2. LINKS (Relationships between Hubs)
# ------------------------------------------------------------------------------
links:
  - target_model: "LNK_PRODUCT_SUPPLIER"
    hash_key: "HK_LNK_PRODUCT_SUPPLIER"
    foreign_hash_keys:
      - "HK_PRODUCT"
      - "HK_SUPPLIER"

# ------------------------------------------------------------------------------
# 3. SATELLITES (Descriptive Context)
# ------------------------------------------------------------------------------
satellites:
  - target_model: "SAT_PRODUCT_SUPPLIER"
    parent_hash_key: "HK_LNK_PRODUCT_SUPPLIER"
    diff_hash: "HD_PRODUCT_SUPPLIER"
    payload:
      AVAILQTY: "PS_AVAILQTY"
      SUPPLYCOST: "PS_SUPPLYCOST"
      COMMENT: "PS_COMMENT"

# ------------------------------------------------------------------------------
# 4. METADATA MAPPING 
# ------------------------------------------------------------------------------
metadata:
  load_timestamp: "_LOAD_TIMESTAMP"
  record_source: "_RECORD_SOURCE"