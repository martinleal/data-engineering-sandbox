# ==============================================================================
# RAW DATA VAULT METADATA: PRODUCT (Source: PART)
# ==============================================================================

source_model: "PRO_RAW.TPCH_SF1.PART"

# ------------------------------------------------------------------------------
# 1. HUBS (Core Business Entities)
# ------------------------------------------------------------------------------
hubs:
  - target_model: "HUB_PRODUCT"
    hash_key: "HK_PRODUCT"
    business_keys: 
      ID_PRODUCT: "P_PARTKEY"

# ------------------------------------------------------------------------------
# 2. LINKS (Relationships between Hubs)
# ------------------------------------------------------------------------------
links: []

# ------------------------------------------------------------------------------
# 3. SATELLITES (Descriptive Context)
# ------------------------------------------------------------------------------
satellites:
  - target_model: "SAT_PRODUCT"
    parent_hash_key: "HK_PRODUCT"
    diff_hash: "HD_PRODUCT"
    payload:
      NAME: "P_NAME"
      MFGR: "P_MFGR"
      BRAND: "P_BRAND"
      TYPE: "P_TYPE"
      SIZE: "P_SIZE"
      CONTAINER: "P_CONTAINER"
      RETAILPRICE: "P_RETAILPRICE"
      COMMENT: "P_COMMENT"

# ------------------------------------------------------------------------------
# 4. METADATA MAPPING 
# ------------------------------------------------------------------------------
metadata:
  load_timestamp: "_LOAD_TIMESTAMP"
  record_source: "_RECORD_SOURCE"