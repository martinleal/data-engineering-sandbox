# ==============================================================================
# RAW DATA VAULT MAPPING: SUPPLIER (Source: SUPPLIER)
# ==============================================================================

source_model: "PRO_RAW.TPCH_SF1.SUPPLIER"

# ------------------------------------------------------------------------------
# 1. HUBS (Core Business Entities)
# ------------------------------------------------------------------------------
hubs:
  - target_model: "HUB_SUPPLIER"
    hash_key: "HK_SUPPLIER"
    business_keys: 
      ID_SUPPLIER: "S_SUPPKEY"

  - target_model: "HUB_NATION"
    hash_key: "HK_NATION"
    business_keys: 
      ID_NATION: "S_NATIONKEY"

# ------------------------------------------------------------------------------
# 2. LINKS (Relationships between Hubs)
# ------------------------------------------------------------------------------
links:
  - target_model: "LNK_SUPPLIER_NATION"
    hash_key: "HK_LNK_SUPPLIER_NATION"
    foreign_hash_keys:
      - "HK_SUPPLIER"
      - "HK_NATION"

# ------------------------------------------------------------------------------
# 3. SATELLITES (Descriptive Context)
# ------------------------------------------------------------------------------
satellites:
  - target_model: "SAT_SUPPLIER_CONTACT"
    parent_hash_key: "HK_SUPPLIER"
    diff_hash: "HD_SUPPLIER_CONTACT"
    payload:
      NAME: "S_NAME"
      ADDRESS: "S_ADDRESS"
      PHONE: "S_PHONE"
      COMMENT: "S_COMMENT"
  - target_model: "SAT_SUPPLIER_ACCOUNT"
    parent_hash_key: "HK_SUPPLIER"
    diff_hash: "HD_SUPPLIER_ACCOUNT"
    payload:
      ACCTBAL: "S_ACCTBAL"

# ------------------------------------------------------------------------------
# 4. METADATA METADATA 
# ------------------------------------------------------------------------------
metadata:
  load_timestamp: "_LOAD_TIMESTAMP"
  record_source: "_RECORD_SOURCE"