sandbox:
  target: dev

  outputs:

    dev:
      type: snowflake
      account: "{{ env_var('SANDBOX_DEV_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SANDBOX_DEV_SNOWFLAKE_USER') }}"
      password: "{{ env_var('SANDBOX_DEV_SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SANDBOX_DEV_SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SANDBOX_DEV_SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SANDBOX_DEV_SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SANDBOX_DEV_SNOWFLAKE_SCHEMA') }}"
      threads: 4

    ci:
      type: snowflake
      account: "{{ env_var('SANDBOX_CI_SNOWFLAKE_ACCOUNT') }}"
      user: DATA_CI_GITHUB
      role: DATA_CI
      warehouse: WH_CI
      database: "{{ env_var('SANDBOX_CI_SNOWFLAKE_DATABASE') }}"
      schema: "CI_{{ env_var('GITHUB_RUN_ID', 'LOCAL') }}"
      private_key: "{{ env_var('SANDBOX_CI_SNOWFLAKE_PRIVATE_KEY') }}"
      threads: 4