
name: Project CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed directories
    runs-on: ubuntu-latest
    outputs:
      data-transformation: ${{ steps.filter.outputs.data-transformation }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect transformation changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            data-transformation:
              - 'data-transformation/**'

  dbt-ci:
    name: Validate dbt project
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.data-transformation == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data-transformation

    env:
      SANDBOX_CI_SNOWFLAKE_ACCOUNT: ${{ secrets.SANDBOX_CI_SNOWFLAKE_ACCOUNT }}
      SANDBOX_CI_SNOWFLAKE_DATABASE: ${{ secrets.SANDBOX_CI_SNOWFLAKE_DATABASE }}
      SANDBOX_CI_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SANDBOX_CI_SNOWFLAKE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dbt Core and Snowflake adapter
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.12.5" "dbt-snowflake==1.12.1"

      - name: Install dbt packages
        run: dbt deps

      - name: Build dbt project
        run: dbt build --target ci

  project-ci:
    name: Validate project CI
    needs: [changes, dbt-ci]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check validation results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS_JSON"
